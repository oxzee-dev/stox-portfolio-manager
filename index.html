  --accent:var(--amber); --r:12px;

}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{

}

body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
a{color:inherit;text-decoration:none}
b{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)} .mixed{color:var(--amber)}

.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:100;background:rgba(255,255,255,.05)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--info));box-shadow:0 0 8px var(--accent)}

.topbar{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:18px;padding:0 16px;height:44px;background:rgba(10,12,16,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;color:var(--hi);font-size:12px;white-space:nowrap}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 2.4s ease-in-out infinite}
.brand em{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--dim);font-weight:400;letter-spacing:.2em;font-size:9px}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:6px 12px;border-radius:8px;color:var(--dim);letter-spacing:.12em;font-size:10px;
  white-space:nowrap;border:1px solid transparent;transition:.18s}
.tabs a:hover{color:var(--hi);background:var(--panel2)}
.tabs a.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700;box-shadow:0 0 14px -4px var(--accent)}
.asof{color:var(--dim);font-size:9.5px;letter-spacing:.08em;white-space:nowrap}

main{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec h2{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:700;white-space:nowrap}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.sec .hint{color:var(--dim);font-size:9.5px;letter-spacing:.06em}

.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .25s,transform .18s ease-out;
  will-change:transform}
.card:hover{border-color:var(--border-hi);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),0 14px 34px -18px color-mix(in srgb,var(--accent) 55%,transparent)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

.hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--panel);padding:26px 24px 22px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.hero::before{width:440px;height:440px;top:-180px;right:-90px;background:color-mix(in srgb,var(--accent) 42%,transparent)}
.hero::after{width:320px;height:320px;bottom:-150px;left:8%;background:color-mix(in srgb,var(--info) 30%,transparent);animation-delay:-8s}
@keyframes drift{to{transform:translate3d(-44px,28px,0) scale(1.14)}}
.hero>*{position:relative;z-index:1}
.eyerow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.eyebrow-t{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);letter-spacing:.16em}
.hero-quotes{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.hq{flex:1 1 200px;min-width:0;border:1px solid var(--border);border-radius:12px;
  padding:13px 16px;background:rgba(255,255,255,.025);transition:border-color .2s,box-shadow .2s}
.hq:hover{border-color:var(--border-hi);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.hq-l{font-size:9.5px;letter-spacing:.18em;color:var(--dim);margin-bottom:2px}
.hq-p{font-size:clamp(30px,5.4vw,46px);line-height:1.05;font-weight:600;color:var(--hi);letter-spacing:-.02em}
.hq-c{font-size:13px;font-weight:600;margin-top:4px}
.hq-m{font-size:9.5px;color:var(--dim);margin-top:2px;letter-spacing:.08em}
.hero-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;padding-top:14px;border-top:1px dashed var(--border)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:10px;
  font-weight:700;letter-spacing:.14em;border:1px solid var(--border);background:var(--panel2)}
.badge .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:blink 1.6s infinite}
.badge.up{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.badge.down{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.badge.mixed,.badge.flat{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.badge.closed{color:var(--dim);border-color:var(--border);background:var(--panel)}
.hero-foot .meta{color:var(--dim);font-size:9.5px;letter-spacing:.08em}

.tape{overflow:hidden;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);padding:7px 0;white-space:nowrap}
.tape-track{display:inline-flex;animation:marquee 52s linear infinite;will-change:transform}
.tape:hover .tape-track{animation-play-state:paused}
.tape-track>span{display:inline-flex}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape-i{position:relative;display:inline-flex;gap:8px;align-items:baseline;padding-right:30px;margin-right:4px}
.tape-i::after{content:"·";position:absolute;right:12px;color:var(--dim)}
.tape-i b{color:var(--hi);letter-spacing:.06em}
.tape-i span{color:var(--dim)}

.q-label{font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.q-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.q-name{font-size:10px;letter-spacing:.12em;color:var(--hi);font-weight:700;text-transform:uppercase}
.q-pe{font-size:9px;color:var(--dim)}
.q-price{font-size:23px;font-weight:600;color:var(--hi);letter-spacing:-.01em;line-height:1.1}
.q-price.sm{font-size:18px}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid var(--border)}
.q-grid div{display:flex;flex-direction:column;gap:2px;min-width:0}
.q-grid i{font-style:normal;font-size:8px;letter-spacing:.1em;color:var(--dim)}

.sub{color:var(--dim);font-size:9.5px;margin-top:8px;letter-spacing:.05em}
.big{font-size:17px;font-weight:600;margin-top:4px}

.chip:hover{border-color:var(--border-hi);transform:translateY(-2px)}
.chip span{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}

.news-src{color:var(--accent);font-size:9px;letter-spacing:.1em;min-width:32px;flex:none}

.news-m{color:var(--dim);font-size:9px;white-space:nowrap;flex:none}

.chip2.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700}

.empty{padding:18px;text-align:center;color:var(--dim);border:1px dashed var(--border);border-radius:var(--r);letter-spacing:.06em}

  main{padding:12px 10px 30px;gap:12px}

  .hero{padding:18px 12px 14px}

  td:first-child,th:first-child{box-shadow:1px 0 0 rgba(255,255,255,.06)}

@media (prefers-reduced-motion:reduce){

}

}
function tapeHtml(){
  const items = Object.entries(DATA.market).flatMap(([g,rs])=>rs.map(r=>
    `<span class="tape-i"><b>${esc(r.name)}</b><span>${num(r.px)}</span><span class="${sgn(r.chg)}">${pct(r.chg)}</span></span>`));
  const half = items.join("");
  return `<div class="tape rv"><div class="tape-track"><span>${half}</span><span>${half}</span></div></div>`;
}
function heroQuote(label,r,d){
  return `<div class="hq">
    <div class="hq-l">${label}</div>
    <div class="hq-p" data-count="${r.px==null?"":r.px}" data-d="${d==null?2:d}">${num(r.px,d)}</div>
    <div class="hq-c ${sgn(r.chg)}">${pct(r.chg)} <span class="hq-m">DAY · 1M ${pct(r.m1)}</span></div>
  </div>`;
}
function movers(n){
  const rows = (DATA.top_stox||[]).filter(r=>r.liveChangePercent!=null)
    .sort((a,b)=>Math.abs(b.liveChangePercent)-Math.abs(a.liveChangePercent)).slice(0,n);
  return rows.map(r=>`<div class="card tilt rv">
    <div class="q-top"><span class="q-name">${esc(r.ticker)}</span><span class="q-pe">alloc ${num(r.allocation)}%</span></div>
    <div class="q-price sm" data-count="${r.currentPrice==null?"":r.currentPrice}">${num(r.currentPrice)}</div>
    <div class="big ${sgn(r.liveChangePercent)}">${pct(r.liveChangePercent)}</div>
    <div class="sub">1W ${pct(r.change1WPercent)} · 1M ${pct(r.change1MPercent)} · 1Y ${pct(r.change1YPercent)}</div>
  </div>`).join("");
}

function newsBlock(){
  const items = (NEWS||[]).slice(0,5);
  if(!items.length) return `<div class="empty rv">no news from SPY / QQQ right now</div>`;
  return `<div class="tblwrap rv">` + items.map(n=>{
    const meta = [
      n.provider && n.provider!=="N/A" ? n.provider : null,
      n.pubDate && n.pubDate!=="N/A" ? String(n.pubDate).slice(0,16).replace("T"," ")+" UTC" : null
    ].filter(Boolean).join(" · ");
    return `<div class="news-i">`+
      `<span class="news-src">${esc(n.src||"")}</span>`+
      `<span class="news-t">${esc(n.title||"")}</span>`+
      `<span class="news-m">${esc(meta)}</span></div>`;
  }).join("") + `</div>`;
}
function viewHome(){

      <span class="meta">breadth ${br.up}/${br.dn}/${br.flat} up/dn/flat · portfolio day ${pct(pd)}</span>
    </div>
  </section>
  ${tapeHtml()}
  <div class="grid g4">
    <div class="card rv">
      <div class="q-label">REGIME</div>
      <span class="badge ${rg.t}" style="font-size:13px;padding:7px 14px"><span class="pulse"></span>${rg.l}</span>
      <div class="sub">SPX 1M ${pct(spx.m1)} · VIX 1W ${pct(vix.w1)}</div>
    </div>
    <div class="card rv">
      <div class="q-label">BREADTH (DAY)</div>
      <div class="br-nums"><b class="up">${br.up} UP</b><b class="flat">${br.flat} FLAT</b><b class="down">${br.dn} DN</b></div>
      <div class="bar3">
        <i class="seg up" data-w="${br.up/total*100}"></i>

      <div class="sub">${Object.values(DATA.market).flat().length} instruments · all groups</div>

        <div><i>1W</i><b class="${sgn(vix.w1)}">${pct(vix.w1)}</b></div>
        <div><i>1M</i><b class="${sgn(vix.m1)}">${pct(vix.m1)}</b></div>
      </div>
    </div>
    <div class="card rv">
      <div class="q-label">PORTFOLIO · TOP 20 (ALLOC-WTD DAY)</div>
      <div class="q-price ${sgn(pd)}" data-count="${pd==null?"":pd}" data-fmt="pct">${pct(pd)}</div>
      <div class="sub">${(DATA.top_stox||[]).length} names · ${num((DATA.top_stox||[]).reduce((s,r)=>s+(r.allocation||0),0),1)}% of book shown</div>

  </div>
  <div class="sec rv"><h2>NEWS</h2><span class="hint">SPY + QQQ · latest ${Math.min(5,(NEWS||[]).length)}</span></div>
  ${newsBlock()}
  <div class="sec rv"><h2>TOP MOVERS TODAY</h2><span class="hint">by |day %| · from top-20 stox</span></div>
  <div class="grid g3">${movers(6)}</div>
  <div class="sec rv"><h2>SECTOR HEAT</h2><span class="hint">S&amp;P sectors · day</span></div>
  <div class="chips">${heat}</div>`;
}
function viewMarkets(){
  const cols=[
    {h:"SECTOR",f:r=>`<b>${esc(r.name)}</b>`},
    {h:"DAY",num:1,f:r=>dlt(r.chg)},{h:"1W",num:1,f:r=>dlt(r.w1)},{h:"1M",num:1,f:r=>dlt(r.m1)},
    {h:"3M",num:1,f:r=>dlt(r.m3)},{h:"1Y",num:1,f:r=>dlt(r.y1)},
    {h:"PE",num:1,f:r=>r.pe==null?"—":num(r.pe,1)}
  ];
  return `
  <div class="sec rv"><h2>US INDICES</h2></div>
  <div class="grid g4">${G("US INDICES").map(r=>qcard(r.name,r)).join("")}</div>

  ${table(cols,G("S&P SECTORS"))}`;

function viewMacro(){
  const blk=(t,rs)=>`<div class="sec rv"><h2>${t}</h2></div><div class="grid g4">${rs.map(r=>qcard(r.name,r)).join("")}</div>`;
  return blk("WORLD",G("WORLD")) + blk("CONDITIONS",G("CONDITIONS")) + blk("HARD ASSETS / CRYPTO",G("HARD ASSETS / CRYPTO"));

function viewWatch(){
  const wcols=[
    {h:"TICKER",f:r=>`<b>${esc(r.ticker)}</b>`},
    {h:"PRICE",num:1,f:r=>num(r.px)},
    {h:"DAY",num:1,f:r=>dlt(r.chg)},{h:"1W",num:1,f:r=>dlt(r.w1)},{h:"1M",num:1,f:r=>dlt(r.m1)},{h:"1Y",num:1,f:r=>dlt(r.y1)},
    {h:"TARGET",num:1,f:r=>num(r.targetMeanPrice)},
    {h:"UPSIDE",num:1,f:r=>`<span class="${sgn(r.up)}">${pct(r.up,1)}</span>`},
    {h:"N",num:1,f:r=>r.numberOfAnalystOpinions==null?"—":String(r.numberOfAnalystOpinions)}
  ];
  const tcols=[
    {h:"TICKER",f:r=>`<b>${esc(r.ticker)}</b>`},
    {h:"ALLOC",num:1,f:r=>num(r.allocation)+"%"},
    {h:"PRICE",num:1,f:r=>num(r.currentPrice)},
    {h:"DAY",num:1,f:r=>dlt(r.liveChangePercent)},{h:"1W",num:1,f:r=>dlt(r.change1WPercent)},
    {h:"1M",num:1,f:r=>dlt(r.change1MPercent)},{h:"3M",num:1,f:r=>dlt(r.change3MPercent)},
    {h:"1Y",num:1,f:r=>dlt(r.change1YPercent)}
  ];
  const earn = DATA.earnings_week||[];
  const ecols=[{h:"TICKER",f:r=>`<b>${esc(r.ticker)}</b>`},{h:"DATE",num:1,f:r=>esc(r.date)},{h:"IN",num:1,f:r=>r.in_days+"d"}];
  const eblock = earn.length ? table(ecols,earn)
    : `<div class="empty rv">no earnings in the next 7 days</div>`;
  return `
  <div class="sec rv"><h2>WATCHLIST</h2><span class="hint">live quotes from db + target upside</span></div>
  ${table(wcols,watchRows())}
  <div class="sec rv"><h2>EARNINGS · NEXT 7 DAYS</h2></div>
  ${eblock}
  <div class="sec rv"><h2>TOP 20 STOX</h2><span class="hint">by allocation</span></div>
  ${table(tcols,DATA.top_stox||[])}`;
}
function viewThemes(){
  const rows = G("THEMES").slice().sort((a,b)=>(b.m1==null?-1e9:b.m1)-(a.m1==null?-1e9:a.m1));
  const maxAbs = Math.max.apply(null,rows.map(r=>Math.abs(r.m1||0)).concat([1]));
  const cards = rows.map((r,i)=>{
    const w = Math.round(Math.abs(r.m1||0)/maxAbs*100);
    return `<div class="card th tilt rv">
      <div class="th-rank">#${i+1}</div>
      <div class="q-name">${esc(r.name)}</div>
      <div class="th-px" data-count="${r.px==null?"":r.px}">${num(r.px)}</div>
      <div class="th-d"><span class="${sgn(r.chg)}">${pct(r.chg)}</span><span style="color:var(--dim)">DAY</span>
        <span class="${sgn(r.m1)}">${pct(r.m1)}</span><span style="color:var(--dim)">1M</span></div>
      <div class="mbar"><i class="${sgn(r.m1)==="down"?"down":"up"}" data-w="${w}"></i></div>
    </div>`;
  }).join("");
  return `<div class="sec rv"><h2>THEMES</h2><span class="hint">ranked by 1M</span></div><div class="grid g4">${cards}</div>`;
}

const SC_ORDER=["value","quality","growth_rule40","momentum","garp","sentiment","risk","alpha_composite"];
const SC_LABEL={value:"VALUE",quality:"QUALITY",growth_rule40:"GROWTH",momentum:"MOMENTUM",
  garp:"GARP",sentiment:"SENTIMENT",risk:"RISK",alpha_composite:"ALPHA"};
let scCur="value";
const COL_LABEL={ticker:"TICKER",allocation:"ALLOC",value_composite:"VAL",trailingPE:"P/E",
  forwardPE:"FWD P/E",pegRatio:"PEG",priceToBook:"P/B",enterpriseToEbitda:"EV/EBITDA",
  quality_score:"QUAL",piotroski_f:"PIOT F",returnOnEquity:"ROE",operatingMargins:"OP MGN",
  debtToEquity:"D/E",rule40:"RULE40",revenueGrowth:"REV GR",earningsGrowth:"EPS GR",
  totalRevenue:"REV",momentum_score:"MOM",liveChangePercent:"DAY",currentPrice:"PRICE",
  fiftyDayAverage:"50DMA",twoHundredDayAverage:"200DMA",beta:"BETA",upside:"UPSIDE",
  targetMeanPrice:"TARGET",recommendationMean:"REC",numberOfAnalystOpinions:"N",
  altman_z:"ALT Z",shortPercentOfFloat:"SHORT %F",currentRatio:"CURRENT",
  alpha:"ALPHA",r_value:"R VAL",r_quality:"R QUAL",r_momentum:"R MOM"};
const SC_PCT_P=["liveChangePercent","upside","change1WPercent","change1MPercent","change3MPercent","change1YPercent"];
const SC_PCT_F=["revenueGrowth","earningsGrowth","returnOnEquity","operatingMargins","shortPercentOfFloat","profitMargins","payoutRatio"];
const SC_MONEY=["currentPrice","targetMeanPrice","fiftyDayAverage","twoHundredDayAverage"];
const SC_INT=["numberOfAnalystOpinions","piotroski_f"];
const SC_0DP=["r_value","r_quality","r_momentum"];
const SC_1DP=["alpha","rule40","trailingPE","forwardPE","pegRatio","priceToBook",
  "enterpriseToEbitda","debtToEquity","currentRatio","recommendationMean","value_composite",
  "quality_score","momentum_score","beta"];
function bigMoney(v){
  const a=Math.abs(v);
  if(a>=1e12) return "$"+num(v/1e12,2)+"T";
  if(a>=1e9) return "$"+num(v/1e9,2)+"B";
  if(a>=1e6) return "$"+num(v/1e6,1)+"M";
  return num(v,0);
}
function fmtCell(c,v){
  if(v==null) return "—";
  if(c==="ticker") return `<b>${esc(v)}</b>`;
  if(c==="allocation") return num(v,2)+"%";
  if(SC_PCT_P.includes(c)) return `<span class="${sgn(v)}">${pct(v,1)}</span>`;
  if(SC_PCT_F.includes(c)) return `<span class="${sgn(v)}">${pct(v*100,1)}</span>`;
  if(c==="totalRevenue") return bigMoney(v);
  if(SC_MONEY.includes(c)) return num(v,2);
  if(c==="altman_z") return `<span class="${sgn(v)}">${num(v,1)}</span>`;
  if(SC_INT.includes(c)) return String(Math.round(v));
  if(SC_0DP.includes(c)) return num(v,0);
  if(SC_1DP.includes(c)) return num(v,1);
  return num(v,2);
}
function scTable(){
  const sc=(SCREENERS||{})[scCur];
  if(!sc||sc.error) return `<div class="empty">${
    esc(sc&&sc.error?("screener error: "+sc.error):"no screener data — run dashboard/build_preview.py")}</div>`;
  const cols=sc.cols.map((c,i)=>({h:COL_LABEL[c]||String(c).toUpperCase(),num:i!==0,f:r=>fmtCell(c,r[c])}));
  return `<div class="sec rv in"><h2>${esc(sc.title)}</h2><span class="hint">${sc.rows.length} rows</span></div>`+
    table(cols,sc.rows,true);
}
function viewScreeners(){
  const chips = SC_ORDER.map(n=>`<button class="chip2${n===scCur?" on":""}" data-sc="${n}">${SC_LABEL[n]}</button>`).join("");
  return `
  <div class="sec rv"><h2>SCREENERS</h2><span class="hint">portfolio.db · stox+watch</span></div>
  <div class="chips2 rv" id="sc-chips">${chips}</div>
  <div id="sc-body">${scTable()}</div>`;
}

const VIEWS = {home:viewHome,markets:viewMarkets,macro:viewMacro,watch:viewWatch,themes:viewThemes,screeners:viewScreeners};
let io = null;
function countUp(node){
  const target = parseFloat(node.dataset.count);
  if(isNaN(target)) return;
  const isPct = node.dataset.fmt==="pct";
  const d = node.dataset.d!=null ? +node.dataset.d : 2;
  const setFinal = ()=>{ node.textContent = isPct ? pct(target) : num(target,d); };
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setFinal(); return; }
  const t0 = performance.now(), dur = 950;
  function step(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3), v = target*e;
    node.textContent = isPct ? pct(v) : num(v,d);
    if(p<1) requestAnimationFrame(step);
    else setFinal();
  }
  requestAnimationFrame(step);
}
function effects(){
  const rg = regime();
  const acc = rg.t==="up" ? "#5a9c7a" : rg.t==="down" ? "#bd6a6a" : "#e0a63c";
  document.documentElement.style.setProperty("--accent",acc);
  document.getElementById("asof").textContent = DATA.asof||"";
  document.getElementById("f-asof").textContent = "snapshot "+(DATA.asof||"");
  const ha = document.getElementById("hero-asof");
  if(ha) ha.textContent = DATA.asof||"";
  paintMarketState();

  if(io) io.disconnect();
  let i = 0;
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        e.target.style.transitionDelay = Math.min(i++,10)*55+"ms";
        e.target.classList.add("in");
        io.unobserve(e.target);
      }
    });
  },{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  q(".rv").forEach(n=>io.observe(n));

  const chips = q("#sc-chips .chip2");
  if(chips.length) chips.forEach(b=>b.addEventListener("click",()=>{
    scCur = b.dataset.sc;
    chips.forEach(x=>x.classList.toggle("on",x.dataset.sc===scCur));
    document.getElementById("sc-body").innerHTML = scTable();
  }));

  q("[data-count]").forEach(n=>{
    if(n.closest(".rv")===null || n.closest(".rv").classList.contains("in")) countUp(n);
    else{
      const card = n.closest(".rv");
      const obs = new IntersectionObserver(es=>{
        es.forEach(e=>{ if(e.isIntersecting){ countUp(n); obs.disconnect(); } });
      },{threshold:.3});
      obs.observe(card);
    }
  });
  requestAnimationFrame(()=>q("[data-w]").forEach(n=>{ n.style.width = n.dataset.w+"%"; }));

  if(window.matchMedia("(pointer:fine)").matches){
    q(".card.tilt").forEach(c=>{
      c.addEventListener("pointermove",e=>{
        if(!c.classList.contains("in")) return;
        const r = c.getBoundingClientRect();
        const x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
        c.style.transform = `perspective(700px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*4).toFixed(2)}deg)`;
      });
      c.addEventListener("pointerleave",()=>{ c.style.transform=""; });
    });
  }
}
function render(){
  const key = (location.hash.replace(/^#\/?/,"") || "home");
  const view = VIEWS[key] || VIEWS.home;
  app.innerHTML = view();
  q("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===key));
  document.title = "STOX // "+key.toUpperCase();
  window.scrollTo(0,0);
  document.getElementById("pbar").style.width = "0";
  effects();
}
window.addEventListener("scroll",()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h>0 ? window.scrollY/h*100 : 0;
  document.getElementById("pbar").style.width = p+"%";
},{passive:true});
window.addEventListener("hashchange",render);
setInterval(paintMarketState,60000);
if(!location.hash) location.hash = "#/home";
render();
})();
</script>
