    <div class="q-price" data-count="${px==null?"":px}">${num(px)}</div>
    <div class="q-grid">${cell("DAY",r.chg)}${cell("1W",r.w1)}${cell("1M",r.m1)}${cell("3M",r.m3)}${cell("1Y",r.y1)}</div>
  </div>`;
}
function tapeHtml(){
  const items = Object.entries(DATA.market).flatMap(([g,rs])=>rs.map(r=>
    `<span class="tape-i"><b>${esc(r.name)}</b><span>${num(r.px)}</span><span class="${sgn(r.chg)}">${pct(r.chg)}</span></span>`));
  const half = items.join("");
  return `<div class="tape rv"><div class="tape-track"><span>${half}</span><span>${half}</span></div></div>`;
}
function heroLines(rows){
  const body=rows.map(r=>`<div class="hrow ${sgn(r.chg)}">`+
    `<span class="hn">${r.n}</span>`+
    `<b class="hv" data-count="${r.px==null?"":r.px}" data-d="${r.d==null?2:r.d}">${num(r.px,r.d)}</b>`+
    `<span class="hc ${sgn(r.chg)}">${pct(r.chg)}</span></div>`).join("");
  return `<div class="hlines rv">${body}</div>`;
}
function movers(n){
  const rows = (DATA.top_stox||[]).filter(r=>r.liveChangePercent!=null)
    .sort((a,b)=>Math.abs(b.liveChangePercent)-Math.abs(a.liveChangePercent)).slice(0,n);
  return rows.map(r=>`<div class="card tilt rv">
    <div class="q-top"><span class="q-name">${esc(r.ticker)}</span><span class="q-pe">alloc ${num(r.allocation)}%</span></div>
    <div class="q-price sm" data-count="${r.currentPrice==null?"":r.currentPrice}">${num(r.currentPrice)}</div>
    <div class="big ${sgn(r.liveChangePercent)}">${pct(r.liveChangePercent)}</div>
    <div class="sub">1W ${pct(r.change1WPercent)} · 1M ${pct(r.change1MPercent)} · 1Y ${pct(r.change1YPercent)}</div>
  </div>`).join("");
}

function newsBlock(){
  const items = (NEWS||[]).slice(0,5);
  if(!items.length) return `<div class="empty rv">no news from SPY / QQQ right now</div>`;
  return `<div class="tblwrap rv">` + items.map(n=>{
    const meta = [
      n.provider && n.provider!=="N/A" ? n.provider : null,
      n.pubDate && n.pubDate!=="N/A" ? String(n.pubDate).slice(0,16).replace("T"," ")+" UTC" : null
    ].filter(Boolean).join(" · ");
    return `<div class="news-i">`+
      `<span class="news-src">${esc(n.src||"")}</span>`+
      `<span class="news-t">${esc(n.title||"")}</span>`+
      `<span class="news-m">${esc(meta)}</span></div>`;
  }).join("") + `</div>`;
}

      <div class="sub">${(DATA.top_stox||[]).length} names · ${num((DATA.top_stox||[]).reduce((s,r)=>s+(r.allocation||0),0),1)}% of book shown</div>

    {h:"SECTOR",f:r=>`<b>${esc(r.name)}</b>`},
    {h:"DAY",num:1,f:r=>dlt(r.chg)},{h:"1W",num:1,f:r=>dlt(r.w1)},{h:"1M",num:1,f:r=>dlt(r.m1)},

function viewThemes(){
  const rows = G("THEMES").slice().sort((a,b)=>(b.m1==null?-1e9:b.m1)-(a.m1==null?-1e9:a.m1));
  const maxAbs = Math.max.apply(null,rows.map(r=>Math.abs(r.m1||0)).concat([1]));
  const cards = rows.map((r,i)=>{
    const w = Math.round(Math.abs(r.m1||0)/maxAbs*100);
    return `<div class="card th tilt rv">
      <div class="th-rank">#${i+1}</div>
      <div class="q-name">${esc(r.name)}</div>
      <div class="th-px" data-count="${r.px==null?"":r.px}">${num(r.px)}</div>
      <div class="th-d"><span class="${sgn(r.chg)}">${pct(r.chg)}</span><span style="color:var(--dim)">DAY</span>
        <span class="${sgn(r.m1)}">${pct(r.m1)}</span><span style="color:var(--dim)">1M</span></div>
      <div class="mbar"><i class="${sgn(r.m1)==="down"?"down":"up"}" data-w="${w}"></i></div>
    </div>`;
  }).join("");
  return `<div class="sec rv"><h2>THEMES</h2><span class="hint">ranked by 1M</span></div><div class="grid g4">${cards}</div>`;
}

const SC_ORDER=["value","quality","growth_rule40","momentum","garp","sentiment","risk","alpha_composite"];
const SC_LABEL={value:"VALUE",quality:"QUALITY",growth_rule40:"GROWTH",momentum:"MOMENTUM",
  garp:"GARP",sentiment:"SENTIMENT",risk:"RISK",alpha_composite:"ALPHA"};
let scCur="value";
const COL_LABEL={ticker:"TICKER",allocation:"ALLOC",value_composite:"VAL",trailingPE:"P/E",
  forwardPE:"FWD P/E",pegRatio:"PEG",priceToBook:"P/B",enterpriseToEbitda:"EV/EBITDA",
  quality_score:"QUAL",piotroski_f:"PIOT F",returnOnEquity:"ROE",operatingMargins:"OP MGN",
  debtToEquity:"D/E",rule40:"RULE40",revenueGrowth:"REV GR",earningsGrowth:"EPS GR",
  totalRevenue:"REV",momentum_score:"MOM",liveChangePercent:"DAY",currentPrice:"PRICE",
  fiftyDayAverage:"50DMA",twoHundredDayAverage:"200DMA",beta:"BETA",upside:"UPSIDE",
  targetMeanPrice:"TARGET",recommendationMean:"REC",numberOfAnalystOpinions:"N",
  altman_z:"ALT Z",shortPercentOfFloat:"SHORT %F",currentRatio:"CURRENT",
  alpha:"ALPHA",r_value:"R VAL",r_quality:"R QUAL",r_momentum:"R MOM"};
const SC_PCT_P=["liveChangePercent","upside","change1WPercent","change1MPercent","change3MPercent","change1YPercent"];
const SC_PCT_F=["revenueGrowth","earningsGrowth","returnOnEquity","operatingMargins","shortPercentOfFloat","profitMargins","payoutRatio"];
const SC_MONEY=["currentPrice","targetMeanPrice","fiftyDayAverage","twoHundredDayAverage"];
const SC_INT=["numberOfAnalystOpinions","piotroski_f"];
const SC_0DP=["r_value","r_quality","r_momentum"];
const SC_1DP=["alpha","rule40","trailingPE","forwardPE","pegRatio","priceToBook",
  "enterpriseToEbitda","debtToEquity","currentRatio","recommendationMean","value_composite",
  "quality_score","momentum_score","beta"];
function bigMoney(v){
  const a=Math.abs(v);
  if(a>=1e12) return "$"+num(v/1e12,2)+"T";
  if(a>=1e9) return "$"+num(v/1e9,2)+"B";
  if(a>=1e6) return "$"+num(v/1e6,1)+"M";
  return num(v,0);
}
function fmtCell(c,v){
  if(v==null) return "—";
  if(c==="ticker") return `<b>${esc(v)}</b>`;
  if(c==="allocation") return num(v,2)+"%";
  if(SC_PCT_P.includes(c)) return `<span class="${sgn(v)}">${pct(v,1)}</span>`;
  if(SC_PCT_F.includes(c)) return `<span class="${sgn(v)}">${pct(v*100,1)}</span>`;
  if(c==="totalRevenue") return bigMoney(v);
  if(SC_MONEY.includes(c)) return num(v,2);
  if(c==="altman_z") return `<span class="${sgn(v)}">${num(v,1)}</span>`;
  if(SC_INT.includes(c)) return String(Math.round(v));
  if(SC_0DP.includes(c)) return num(v,0);
  if(SC_1DP.includes(c)) return num(v,1);
  return num(v,2);
}
function scTable(){
  const sc=(SCREENERS||{})[scCur];
  if(!sc||sc.error) return `<div class="empty">${
    esc(sc&&sc.error?("screener error: "+sc.error):"no screener data — run dashboard/build_preview.py")}</div>`;
  const cols=sc.cols.map((c,i)=>({h:COL_LABEL[c]||String(c).toUpperCase(),num:i!==0,f:r=>fmtCell(c,r[c])}));
  return `<div class="sec rv in"><h2>${esc(sc.title)}</h2><span class="hint">${sc.rows.length} rows</span></div>`+
    table(cols,sc.rows,true);
}
function viewScreeners(){
  const chips = SC_ORDER.map(n=>`<button class="chip2${n===scCur?" on":""}" data-sc="${n}">${SC_LABEL[n]}</button>`).join("");
  return `
  <div class="sec rv"><h2>SCREENERS</h2><span class="hint">portfolio.db · stox+watch</span></div>
  <div class="chips2 rv" id="sc-chips">${chips}</div>
  <div id="sc-body">${scTable()}</div>`;
}

const VIEWS = {home:viewHome,markets:viewMarkets,macro:viewMacro,watch:viewWatch,themes:viewThemes,screeners:viewScreeners};
let io = null;
function countUp(node){
  const target = parseFloat(node.dataset.count);
  if(isNaN(target)) return;
  const isPct = node.dataset.fmt==="pct";
  const d = node.dataset.d!=null ? +node.dataset.d : 2;
  const setFinal = ()=>{ node.textContent = isPct ? pct(target) : num(target,d); };
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setFinal(); return; }
  const t0 = performance.now(), dur = 950;
  function step(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3), v = target*e;
    node.textContent = isPct ? pct(v) : num(v,d);
    if(p<1) requestAnimationFrame(step);
    else setFinal();
  }
  requestAnimationFrame(step);
}
function effects(){
  const rg = regime();
  const acc = rg.t==="up" ? "#5a9c7a" : rg.t==="down" ? "#bd6a6a" : "#e0a63c";
  document.documentElement.style.setProperty("--accent",acc);
  document.getElementById("asof").textContent = DATA.asof||"";
  document.getElementById("f-asof").textContent = "snapshot "+(DATA.asof||"");
  const ha = document.getElementById("hero-asof");
  if(ha) ha.textContent = DATA.asof||"";
  paintMarketState();

  if(io) io.disconnect();
  let i = 0;
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        e.target.style.transitionDelay = Math.min(i++,10)*55+"ms";
        e.target.classList.add("in");
        io.unobserve(e.target);
      }
    });
  },{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  q(".rv").forEach(n=>io.observe(n));

  const chips = q("#sc-chips .chip2");
  if(chips.length) chips.forEach(b=>b.addEventListener("click",()=>{
    scCur = b.dataset.sc;
    chips.forEach(x=>x.classList.toggle("on",x.dataset.sc===scCur));
    document.getElementById("sc-body").innerHTML = scTable();
  }));

  q("[data-count]").forEach(n=>{
    if(n.closest(".rv")===null || n.closest(".rv").classList.contains("in")) countUp(n);
    else{
      const card = n.closest(".rv");
      const obs = new IntersectionObserver(es=>{
        es.forEach(e=>{ if(e.isIntersecting){ countUp(n); obs.disconnect(); } });
      },{threshold:.3});
      obs.observe(card);
    }
  });
  requestAnimationFrame(()=>q("[data-w]").forEach(n=>{ n.style.width = n.dataset.w+"%"; }));

  if(window.matchMedia("(pointer:fine)").matches){
    q(".card.tilt").forEach(c=>{
      c.addEventListener("pointermove",e=>{
        if(!c.classList.contains("in")) return;
        const r = c.getBoundingClientRect();
        const x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
        c.style.transform = `perspective(700px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*4).toFixed(2)}deg)`;
      });
      c.addEventListener("pointerleave",()=>{ c.style.transform=""; });
    });
  }
}
function render(){
  const key = (location.hash.replace(/^#\/?/,"") || "home");
  const view = VIEWS[key] || VIEWS.home;
  app.innerHTML = view();
  q("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===key));
  document.title = "STOX // "+key.toUpperCase();
  window.scrollTo(0,0);
  document.getElementById("pbar").style.width = "0";
  effects();
}
window.addEventListener("scroll",()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const p = h>0 ? window.scrollY/h*100 : 0;
  document.getElementById("pbar").style.width = p+"%";
},{passive:true});
window.addEventListener("hashchange",render);
setInterval(paintMarketState,60000);
if(!location.hash) location.hash = "#/home";
render();
})();
</script>
